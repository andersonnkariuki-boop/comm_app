<ion-header>
  <ion-toolbar>
    <ion-title>Serial Devices</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Connection Setup</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>
        <ion-label>Baud Rate</ion-label>
        <ion-select [(ngModel)]="selectedBaud">
          <ion-select-option *ngFor="let b of baudRates" [value]="b">
            {{ b }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-button expand="block" (click)="refresh()">
        Refresh Device
      </ion-button>

      <ion-button
        expand="block"
        color="primary"
        (click)="connect()"
        [disabled]="connecting"
      >
        {{ connecting ? 'Connecting...' : 'Connect USB Serial' }}
      </ion-button>

    </ion-card-content>
  </ion-card>

</ion-content>
