<ion-header>
  <ion-toolbar>
    <ion-title>USB Devices</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-button expand="block" (click)="refresh()">
    Refresh Devices
  </ion-button>

  <ion-list>
    <ion-item *ngFor="let d of devices" (click)="connect(d)">
      {{ d.name }}
    </ion-item>
  </ion-list>

</ion-content>
