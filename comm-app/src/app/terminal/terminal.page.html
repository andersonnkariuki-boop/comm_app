<ion-header>
  <ion-toolbar>
    <ion-title>Terminal</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="toggleHex()">
        HEX
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="terminal">

    <div *ngFor="let l of logs">
      {{ l }}
    </div>

  </div>

  <ion-item>
    <ion-input [(ngModel)]="msg"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="send()">
    SEND
  </ion-button>

</ion-content>
